name: Threads自動投稿

on:
  schedule:
    - cron: "0 21 * * 0-4"   # 朝6:00 JST 月〜金 (UTC日〜木 21:00)
    - cron: "0 3 * * 1-5"    # 昼12:00 JST 月〜金 (UTC 3:00)
    - cron: "0 12 * * 1-5"   # 晩21:00 JST 月〜金 (UTC 12:00)
    - cron: "0 3 * * 6"      # 昼12:00 JST 土 (UTC 3:00) → D（実例訴求）
    - cron: "0 3 * * 0"      # 昼12:00 JST 日 (UTC 3:00) → E（ストーリー連載）
  workflow_dispatch:
    inputs:
      post_type:
        description: "投稿タイプ (A/B/C/D/E)"
        required: false
        default: "A"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージインストール
        run: pip install -r requirements.txt

      - name: 投稿タイプを判定
        id: type
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%H)
          DOW=$(TZ=Asia/Tokyo date +%u)  # 1=Mon ... 6=Sat, 7=Sun
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "post_type=${{ github.event.inputs.post_type }}" >> $GITHUB_OUTPUT
          elif [ "$DOW" = "6" ]; then
            echo "post_type=D" >> $GITHUB_OUTPUT
          elif [ "$DOW" = "7" ]; then
            echo "post_type=E" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 5 ] && [ "$HOUR" -lt 10 ]; then
            echo "post_type=A" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 10 ] && [ "$HOUR" -lt 17 ]; then
            echo "post_type=B" >> $GITHUB_OUTPUT
          else
            echo "post_type=C" >> $GITHUB_OUTPUT
          fi

      - name: Threads投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python threads_auto_post.py --once --type=${{ steps.type.outputs.post_type }}

      - name: 投稿ログをリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_log.csv
          git diff --cached --quiet || git commit -m "post_log: $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M') 投稿記録"
          git push
