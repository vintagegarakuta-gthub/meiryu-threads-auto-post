name: Threads投稿分析

on:
  schedule:
    - cron: "30 12 * * 2-6"  # 毎週火〜土 21:30 JST（前日分を分析）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージインストール
        run: pip install -r requirements.txt

      - name: インサイト取得
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python threads_analytics.py

      - name: 分析データをリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics.csv
          git diff --cached --quiet || git commit -m "analytics: $(date +'%Y-%m-%d') インサイト更新"
          git push
